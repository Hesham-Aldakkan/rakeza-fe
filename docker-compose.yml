version: '3.9'

services:
  rakeza-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakeza-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api}
      - NEXT_PUBLIC_DEFAULT_LOCALE=${NEXT_PUBLIC_DEFAULT_LOCALE:-ar}
      - NEXT_PUBLIC_SUPPORTED_LOCALES=${NEXT_PUBLIC_SUPPORTED_LOCALES:-ar,en}
      - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME:-Rakeza}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_FEATURE_CHAT=${NEXT_PUBLIC_FEATURE_CHAT:-true}
      - NEXT_PUBLIC_FEATURE_PARALLEL=${NEXT_PUBLIC_FEATURE_PARALLEL:-true}
      - NEXT_PUBLIC_FEATURE_MEDIATOR=${NEXT_PUBLIC_FEATURE_MEDIATOR:-true}
      - NEXT_PUBLIC_ANALYTICS_ENABLED=${NEXT_PUBLIC_ANALYTICS_ENABLED:-false}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - rakeza-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - rakeza-backend

  rakeza-backend:
    image: placeholder-backend:latest
    container_name: rakeza-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-}
    networks:
      - rakeza-network
    profiles:
      - full
    # Note: Replace with actual backend image or service

networks:
  rakeza-network:
    driver: bridge

# Usage:
# Development (frontend only):
#   docker-compose up rakeza-frontend
#
# Full stack (requires backend image):
#   docker-compose --profile full up
